[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "miccoord"
dynamic = ["version"]
description = "Offline, explainable third-order wireless-microphone frequency planning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "KanadeK", email = "121669563+KanadeK@users.noreply.github.com" },
]
keywords = ["wireless-microphone", "frequency-coordination", "intermodulation", "live-sound", "rf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KanadeK/miccoord"
Issues = "https://github.com/KanadeK/miccoord/issues"
Changelog = "https://github.com/KanadeK/miccoord/blob/main/CHANGELOG.md"

[project.scripts]
miccoord = "miccoord.cli:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "packaging>=26.3,<27",
  "pip-audit>=2.9,<3",
  "pytest>=9.0,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.version]
path = "src/miccoord/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/miccoord"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["miccoord"]
omit = ["src/miccoord/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["miccoord"]
